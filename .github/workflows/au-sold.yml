name: AU sold prices

# Nightly pre-check of Australian sold prices (eBay.com.au, Australian sellers) for every
# single worth A$50+, a share each night so each is re-checked about every 2 weeks.
# Uses the SOLDCOMPS_API_KEY secret; writes data/au-sold.json for the app.
on:
  schedule:
    - cron: '15 19 * * *'   # 05:15 AEST, after the price update
  workflow_dispatch:
    inputs:
      budget:
        description: 'Searches to use this run (blank = the nightly share, ~270)'
        default: ''

permissions:
  contents: write

concurrency:
  group: au-sold
  cancel-in-progress: false

jobs:
  au-sold:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check AU sold prices
        env:
          SOLDCOMPS_API_KEY: ${{ secrets.SOLDCOMPS_API_KEY }}
          BUDGET: ${{ inputs.budget }}
        run: node tools/au-sold-precheck.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/au-sold.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update AU sold prices"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
