name: AU sold prices

# Pre-check of Australian sold prices (eBay.com.au) for singles worth A$50+, writing
# data/au-sold.json for the app. Uses the SOLDCOMPS_API_KEY secret.
# MANUAL ONLY — the owner does not want automatic (nightly) price checks; don't add a schedule.
# It searches only when run by hand with a budget. Live lookups when a card is opened are
# done by the worker (500 searches a day at most, wrangler.jsonc).
on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Searches to use this run (required; blank = none)'
        default: ''
      rate:
        description: 'Searches started per minute (blank = 6 at a time)'
        default: ''

permissions:
  contents: write

concurrency:
  group: au-sold
  cancel-in-progress: false

jobs:
  au-sold:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check AU sold prices
        env:
          SOLDCOMPS_API_KEY: ${{ secrets.SOLDCOMPS_API_KEY }}
          BUDGET: ${{ inputs.budget }}
          RATE: ${{ inputs.rate }}
        run: node tools/au-sold-precheck.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/au-sold.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update AU sold prices"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
