name: Update prices

# Nightly snapshot of TCGplayer prices (data/prices.json) for the app, plus history, market and
# buy ideas. TCGplayer data only (free) — Australian sold prices (au-sold.yml, SoldComps credits)
# are never updated on a schedule: only when the owner asks.
on:
  schedule:
    - cron: '30 18 * * *'   # 04:30 AEST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download prices
        run: node tools/update-prices.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "Update prices"
            # Someone else may have pushed meanwhile: rebase onto it (this run's fresh data wins
            # any conflict in data/) and try again.
            for i in 1 2 3; do git push && exit 0; sleep $((i * 5)); git pull --rebase -X theirs -q || exit 1; done
            git push
          fi
