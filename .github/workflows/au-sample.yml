name: AU sold sample (one-off)

# Fetches raw eBay.com.au sold listings for tools/au-sample/list.json to test the AU sold filter.
# MANUAL ONLY, capped by the budget input (max 190 searches).
on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Searches to use (max 190; blank = none)'
        default: ''

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch sold listings
        env:
          SOLDCOMPS_API_KEY: ${{ secrets.SOLDCOMPS_API_KEY }}
          BUDGET: ${{ inputs.budget }}
        run: node tools/au-sample/fetch.mjs
      - name: Commit raw listings to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add tools/au-sample/raw.json
          git diff --cached --quiet || (git commit -m "AU sold sample: raw listings" && git push)
