name: Update prices

# Daily snapshot of TCGplayer prices (data/prices.json) for the app.
on:
  schedule:
    - cron: '30 18 * * *'   # 04:30 AEST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download prices
        run: node tools/update-prices.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "Update prices"
            git push
          fi
